[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "play-review-panel"
version = "0.1.0"
description = "Google Play review panel and backtest for listed consumer-internet companies"
requires-python = ">=3.11"
dependencies = [
  "google-play-scraper>=1.2.7",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "yfinance>=0.2.40",
  "vaderSentiment>=3.3.2",
  "pyarrow>=15",
  "tabulate>=0.9",
]

[project.scripts]
prpanel = "prpanel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
